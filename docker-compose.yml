services:
  windows11:
    image: dockurr/windows:latest
    container_name: windows11

    environment:
      VERSION: "11"
      NETWORK: "nat"
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      DISK_SIZE: "64G"
      USERNAME: "Ben"
      PASSWORD: "請在這裡改成你自己的 Windows 密碼"

    devices:
      - /dev/kvm
      - /dev/net/tun

    cap_add:
      - NET_ADMIN

    # Codespaces 常見 DNS；Docker 容器本身需要能解析
    # Microsoft 下載站，以及讓 Dockur 的 NAT 有穩定的上游 DNS。
    dns:
      - 168.63.129.16
      - 1.1.1.1
      - 8.8.8.8

    ports:
      - "8006:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"

    volumes:
      - ./windows/data:/storage

    restart: unless-stopped
    stop_grace_period: 2m
